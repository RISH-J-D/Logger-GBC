<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Sign out</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login">
    <form class="card" id="form">
      <div class="brand"><span class="logo">↩</span> Struzon Monitor</div>
      <h1>Signing out</h1>
      <p class="sub muted">Please tell us why you're signing out.</p>

      <label>Reason
        <select id="reason" required>
          <option value="" disabled selected>Select a reason…</option>
          <option value="meeting">Meeting</option>
          <option value="break">Break / Lunch</option>
          <option value="end_of_day">Logging off for the day</option>
          <option value="other">Other</option>
        </select>
      </label>
      <input id="note" placeholder="Add a note (optional)" />

      <button type="submit" id="submit">Confirm sign out</button>
      <button type="button" class="link" id="cancel">Cancel</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script src="logout.js"></script>
</body>
</html>
