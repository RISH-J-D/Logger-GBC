<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Monitoring stopped</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stopped">
    <div class="stopped-card">
      <div class="big">🛑</div>
      <h1>You are out of monitoring</h1>
      <p class="who" id="who"></p>
      <p class="muted">Monitoring has been <b>stopped by the administrator</b>.
        You are no longer being tracked. If monitoring is resumed, this app will
        ask you to sign in again automatically.</p>
      <div class="status" id="status">● Waiting for the administrator…</div>
      <button type="button" id="close">Minimise</button>
    </div>
  </div>
  <script src="stopped.js"></script>
</body>
</html>
